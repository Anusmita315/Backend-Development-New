<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes / Todo App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #noteInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .add-btn {
            background: #333;
            color: white;
        }

        .note-card {
            background: white;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .note-text {
            margin: 0 0 10px;
            font-size: 18px;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .edit-btn {
            background: #ddd;
        }

        .delete-btn {
            background: #ddd;
        }

        .complete-btn {
            background: #ddd;
        }

        .empty {
            text-align: center;
            color: gray;
        }
    </style>
</head>

<body>

    <h1>📝 Notes / Todo App</h1>

    <div class="input-area">
        <input
            type="text"
            id="noteInput"
            placeholder="Type a note..."
        >
        <button class="add-btn" onclick="addNoteFromInput()">
            Add Note
        </button>
    </div>

    <div id="notesList"></div>

    <script>
        // Get notes from localStorage
        function getNotes() {
            const raw = localStorage.getItem("notes");
            return raw ? JSON.parse(raw) : [];
        }

        // Save notes to localStorage
        function saveNotes(notes) {
            localStorage.setItem("notes", JSON.stringify(notes));
        }

        // Add a new note
        function addNote(text) {
            text = text.trim();

            if (!text) {
                alert("Please enter a note.");
                return;
            }

            const notes = getNotes();

            notes.push({
                id: Date.now(),
                text: text,
                completed: false,
                createdAt: new Date().toISOString(),
                updatedAt: null
            });

            saveNotes(notes);
            renderNotes();
        }

        // Add note from input
        function addNoteFromInput() {
            const input = document.getElementById("noteInput");

            addNote(input.value);

            input.value = "";
        }

        // Edit an existing note
        function editNote(id) {
            const notes = getNotes();
            const note = notes.find(n => n.id === id);

            if (!note) return;

            const newText = prompt("Edit your note:", note.text);

            if (newText === null) return;

            const trimmedText = newText.trim();

            if (!trimmedText) {
                alert("Note cannot be empty.");
                return;
            }

            note.text = trimmedText;
            note.updatedAt = new Date().toISOString();

            saveNotes(notes);
            renderNotes();
        }

        // Delete a note
        function deleteNote(id) {
            const notes = getNotes().filter(n => n.id !== id);

            saveNotes(notes);
            renderNotes();
        }

        // Mark note complete/incomplete
        function toggleComplete(id) {
            const notes = getNotes();
            const note = notes.find(n => n.id === id);

            if (!note) return;

            note.completed = !note.completed;
            note.updatedAt = new Date().toISOString();

            saveNotes(notes);
            renderNotes();
        }

        // Display all notes
        function renderNotes() {
            const container = document.getElementById("notesList");
            const notes = getNotes();

            if (notes.length === 0) {
                container.innerHTML =
                    '<p class="empty">No notes yet. Add your first note!</p>';
                return;
            }

            container.innerHTML = notes.map(note => `
                <div class="note-card">
                    <p class="note-text ${note.completed ? "completed" : ""}">
                        ${escapeHTML(note.text)}
                    </p>

                    <small>
                        Created: ${new Date(note.createdAt).toLocaleString()}
                    </small>

                    ${note.updatedAt ? `
                        <br>
                        <small>
                            Updated: ${new Date(note.updatedAt).toLocaleString()}
                        </small>
                    ` : ""}

                    <div class="actions">
                        <button class="complete-btn"
                            onclick="toggleComplete(${note.id})">
                            ${note.completed ? "Undo" : "Complete"}
                        </button>

                        <button class="edit-btn"
                            onclick="editNote(${note.id})">
                            Edit
                        </button>

                        <button class="delete-btn"
                            onclick="deleteNote(${note.id})">
                            Delete
                        </button>
                    </div>
                </div>
            `).join("");
        }

        // Prevent HTML injection when displaying note text
        function escapeHTML(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        // Load saved notes when page opens
        window.onload = renderNotes;
    </script>

</body>
</html>
